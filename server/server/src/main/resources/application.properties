spring.application.name=backend

# Database Configuration (H2 In-Memory Database)
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartparkingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ESP32 Wi-Fi gate control. Reserve a stable LAN IP for the ESP32.
esp32.wifi.base-url=${ESP32_WIFI_BASE_URL:}
esp32.wifi.poll-interval-ms=${ESP32_WIFI_POLL_INTERVAL_MS:1000}
esp32.wifi.command-timeout-ms=${ESP32_WIFI_COMMAND_TIMEOUT_MS:5000}
esp32.wifi.connection-timeout-ms=${ESP32_WIFI_CONNECTION_TIMEOUT_MS:2000}
esp32.gate-control-token=${ESP32_GATE_CONTROL_TOKEN:}

# Security guard account (set SECURITY_GUARD_PASSWORD before starting the app).
security.guard.username=${SECURITY_GUARD_USERNAME:guard}
security.guard.password=${SECURITY_GUARD_PASSWORD:}

# HC-SR04 parking occupancy (distance in centimetres)
# Keep this threshold aligned with the ESP32 firmware.
parking.sensor.occupancy-threshold-cm=5
parking.sensor.reverse-warning-threshold-cm=3
parking.sensor.max-distance-cm=400
parking.sensor.min-slot-number=1
parking.sensor.max-slot-number=4
parking.sensor.stale-after-seconds=10

# Server Port
server.port=${SERVER_PORT:8080}
