spring.application.name=backend

# Database Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:smartparkingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ESP32 Barrier Controller Settings
esp32.base-url=http://192.168.1.100
esp32.connect-timeout-ms=3000
esp32.read-timeout-ms=3000
esp32.mock-mode-enabled=true

# Server Port
server.port=8080
