<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Guard - Barrier Control</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div id="security-dashboard" class="security-dashboard">
    <div class="gate-control-card card">
        <div class="card-body">
            <h1 class="gate-control-title">Gate Control Panel</h1>

            <div class="gate-status-group">
                <div class="gate-status-item">
                    <span>ESP32 Status:</span>
                    <span id="espStatus" class="gate-badge gate-badge-offline">Checking...</span>
                </div>
                <div class="gate-status-item">
                    <span>Entry Gate:</span>
                    <span id="entryStatus" class="gate-badge gate-badge-closed">Unknown</span>
                </div>
                <div class="gate-status-item">
                    <span>Exit Gate:</span>
                    <span id="exitStatus" class="gate-badge gate-badge-closed">Unknown</span>
                </div>
            </div>

            <button id="openEntryBtn" class="gate-action-btn" type="button">
                Open Entry Barrier
            </button>
            <button id="openExitBtn" class="gate-action-btn" type="button">
                Open Exit Barrier
            </button>

            <div id="messageBox" class="gate-message" role="status" aria-live="polite"></div>
        </div>
    </div>
</div>

<script>
    let gateStatusIntervalId = null;

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("openEntryBtn").addEventListener("click", () => openBarrier("entry"));
        document.getElementById("openExitBtn").addEventListener("click", () => openBarrier("exit"));

        fetchGateStatus();
        gateStatusIntervalId = setInterval(fetchGateStatus, 3000);
    });

    function setGateBadge(elementId, text, className) {
        const badge = document.getElementById(elementId);
        if (badge) {
            badge.textContent = text;
            badge.className = className;
        }
    }

    function showMessage(text, isSuccess) {
        const messageBox = document.getElementById("messageBox");
        if (!messageBox) {
            return;
        }

        messageBox.textContent = text;
        messageBox.className = isSuccess
            ? "gate-message gate-message-success"
            : "gate-message gate-message-error";
        messageBox.style.display = "block";
    }

    function hideMessage() {
        const messageBox = document.getElementById("messageBox");
        if (messageBox) {
            messageBox.style.display = "none";
        }
    }

    async function fetchGateStatus() {
        try {
            const response = await fetch("/api/gates/status", {
                method: "GET",
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) {
                throw new Error(`HTTP Error Status: ${response.status}`);
            }

            const data = await response.json();

            setGateBadge("espStatus", "Online", "gate-badge gate-badge-online");

            const entryState = data.entryGate || "CLOSED";
            setGateBadge(
                "entryStatus",
                entryState,
                entryState === "OPEN"
                    ? "gate-badge gate-badge-open"
                    : "gate-badge gate-badge-closed"
            );

            const exitState = data.exitGate || "CLOSED";
            setGateBadge(
                "exitStatus",
                exitState,
                exitState === "OPEN"
                    ? "gate-badge gate-badge-open"
                    : "gate-badge gate-badge-closed"
            );
        } catch (error) {
            setGateBadge("espStatus", "Offline", "gate-badge gate-badge-offline");
        }
    }

    async function openBarrier(gateType) {
        const buttonId = gateType === "entry" ? "openEntryBtn" : "openExitBtn";
        const endpoint = gateType === "entry" ? "/api/gates/entry/open" : "/api/gates/exit/open";
        const defaultSuccessMessage = gateType === "entry"
            ? "Entry barrier opened successfully!"
            : "Exit barrier opened successfully!";
        const defaultErrorMessage = gateType === "entry"
            ? "Failed to open entry barrier. Try again."
            : "Failed to open exit barrier. Try again.";

        const button = document.getElementById(buttonId);
        if (!button || button.disabled) {
            return;
        }

        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = "Processing...";
        hideMessage();

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });

            if (!response.ok) {
                throw new Error(`HTTP Error Status: ${response.status}`);
            }

            const result = await response.json();
            showMessage(result.message || defaultSuccessMessage, true);
            await fetchGateStatus();
        } catch (error) {
            showMessage(defaultErrorMessage, false);
        } finally {
            button.disabled = false;
            button.textContent = originalText;
        }
    }
</script>
</body>
</html>
